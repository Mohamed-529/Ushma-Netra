<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1528"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="hotJet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coolPlume" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowRed" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .jet-dash { stroke-dasharray: 10 6; animation: moveJet 0.65s linear infinite; }
      .sky-dash { stroke-dasharray: 10 6; animation: moveJet 0.8s linear infinite; }
      .scan-bar { animation: sweepY 3.6s ease-in-out infinite; }
      .blink { animation: pulseOp 1.4s ease-in-out infinite; }
      @keyframes moveJet { from { stroke-dashoffset: 32; } to { stroke-dashoffset: 0; } }
      @keyframes sweepY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(250px); } }
      @keyframes pulseOp { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1200" height="540" rx="18" fill="url(#bgDark)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Cinema Player Chrome -->
  <rect x="0" y="0" width="1200" height="54" rx="18" fill="#091020"/>
  <circle cx="28" cy="27" r="6" fill="#ef4444"/>
  <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="27" r="6" fill="#10b981"/>
  <circle cx="104" cy="27" r="5" fill="#ef4444" class="blink"/>
  <text x="118" y="32" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="800" letter-spacing="1.5">
    LIVE 30s CINEMATIC SHOWCASE REEL • USHMA-NETRA 3D STREET CANYON ENGINE
  </text>
  <rect x="975" y="13" width="200" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1075" y="31" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800">
    AWS AMPLIFY • 60 FPS WEBGL
  </text>

  <!-- LEFT VIEWPORT: UNMITIGATED 53.6°C BLAST -->
  <g transform="translate(28, 74)">
    <rect x="0" y="0" width="556" height="388" rx="14" fill="#0d1322" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="16" y="16" width="280" height="28" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="28" y="34" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800">
      SCENE 01 • UNMITIGATED AC DUMPING
    </text>

    <!-- 3D Isometric Commercial Tower Left -->
    <polygon points="40,90 165,60 165,330 40,360" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <polygon points="165,60 220,85 220,355 165,330" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="102" y="125" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="800">20.5°C</text>
    <text x="102" y="142" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">CHILLED MALL</text>

    <!-- 64 Condenser Vents on Wall -->
    <rect x="176" y="170" width="32" height="24" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="176" y="204" width="32" height="24" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="176" y="238" width="32" height="24" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Horizontal 53.6°C Thermal Plume Hitting Vendor Cart -->
    <path d="M 210 185 C 295 190, 350 245, 420 275" fill="none" stroke="url(#hotJet)" stroke-width="26" opacity="0.45" filter="url(#glowRed)"/>
    <path d="M 210 185 C 295 190, 350 245, 420 275" fill="none" stroke="#ef4444" stroke-width="3.5" class="jet-dash"/>
    <path d="M 210 220 C 300 230, 355 270, 420 295" fill="none" stroke="#f97316" stroke-width="3" class="jet-dash"/>
    <path d="M 210 250 C 290 285, 340 310, 310 330 C 275 345, 240 315, 260 280" fill="none" stroke="#fbbf24" stroke-width="2.5" class="jet-dash"/>

    <circle r="6" fill="#fef08a" filter="url(#glowRed)">
      <animateMotion dur="0.9s" repeatCount="indefinite" path="M 210 185 C 295 190, 350 245, 420 275"/>
    </circle>
    <circle r="5" fill="#f97316" filter="url(#glowRed)">
      <animateMotion dur="1.1s" repeatCount="indefinite" path="M 210 220 C 300 230, 355 270, 420 295"/>
    </circle>

    <!-- Street Vendor Pushcart in Red Hazard Zone -->
    <ellipse cx="425" cy="312" rx="72" ry="26" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="385" y="268" width="80" height="40" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
    <text x="425" y="292" text-anchor="middle" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="11" font-weight="800">VENDOR CART</text>

    <!-- Telemetry Callouts -->
    <rect x="295" y="72" width="242" height="84" rx="10" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="312" y="98" fill="#f87171" font-family="ui-monospace, monospace" font-size="12" font-weight="800">EXHAUST JET: 53.6°C (638.4 kW)</text>
    <text x="312" y="120" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="800">VENDOR WBGT: 36.8°C (LETHAL)</text>
    <text x="312" y="140" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">Location 5m Geofence: BREACHED</text>
  </g>

  <!-- RIGHT VIEWPORT: 45° SKYWARD LOUVERS + 70-BAR MISTING -->
  <g transform="translate(616, 74)">
    <rect x="0" y="0" width="556" height="388" rx="14" fill="#071722" stroke="#10b981" stroke-width="1.8"/>
    <rect x="16" y="16" width="335" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="34" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800">
      SCENE 02 • 45° LOUVERS + 70-BAR MIST COOLING
    </text>

    <!-- 3D Isometric Commercial Tower Right -->
    <polygon points="40,90 165,60 165,330 40,360" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <polygon points="165,60 220,85 220,355 165,330" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- 45° Upward Louver Blades -->
    <line x1="176" y1="185" x2="218" y2="165" stroke="#10b981" stroke-width="4"/>
    <line x1="176" y1="215" x2="218" y2="195" stroke="#10b981" stroke-width="4"/>
    <line x1="176" y1="245" x2="218" y2="225" stroke="#10b981" stroke-width="4"/>

    <!-- Skyward Deflected Plume (45° Upward Escape) -->
    <path d="M 215 175 C 265 130, 315 80, 375 35" fill="none" stroke="url(#coolPlume)" stroke-width="22" opacity="0.4" filter="url(#glowCyan)"/>
    <path d="M 215 175 C 265 130, 315 80, 375 35" fill="none" stroke="#38bdf8" stroke-width="3.5" class="sky-dash"/>
    <path d="M 215 210 C 275 160, 330 105, 395 55" fill="none" stroke="#10b981" stroke-width="3" class="sky-dash"/>

    <circle r="6" fill="#67e8f9" filter="url(#glowCyan)">
      <animateMotion dur="0.95s" repeatCount="indefinite" path="M 215 175 C 265 130, 315 80, 375 35"/>
    </circle>

    <!-- 70-Bar Evaporative Mist Canopy Over Vendor Cart -->
    <ellipse cx="425" cy="312" rx="76" ry="28" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.8"/>
    <rect x="385" y="268" width="80" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="425" y="292" text-anchor="middle" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="11" font-weight="800">COOLED CART</text>

    <!-- Telemetry Callouts Right -->
    <rect x="295" y="160" width="242" height="92" rx="10" fill="#091926" stroke="#10b981" stroke-width="1.5"/>
    <text x="312" y="186" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="800">STREET WBGT: 29.8°C (-7.0°C)</text>
    <text x="312" y="208" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="800">PLUME VECTOR: +45° SKYWARD</text>
    <text x="312" y="228" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5">Sec 133 Rebate: -65% Surcharge</text>
  </g>

  <!-- Bottom Timeline Scrubber Bar -->
  <rect x="28" y="478" width="1144" height="42" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="44" y="495" width="1112" height="8" rx="4" fill="#1e293b"/>
  <rect x="44" y="495" width="760" height="8" rx="4" fill="#f59e0b">
    <animate attributeName="width" values="120;1112;120" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="48" y="490" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">
    00:00  •  01 THERMAL GRID (/grid)  •  02 3D DIGITAL TWIN (/twin)  •  03 AI CV SCANNER (/scanner)  •  04 NEPTUNE &amp; GUARDRAILS (/ledger)  •  00:30
  </text>
</svg>
