      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111d3b"/>
      <stop offset="100%" stop-color="#091022"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="0%" y2="100%">
